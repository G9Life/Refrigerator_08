<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>냉장고 재료 인식</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="hero">
        <p class="eyebrow">PRD Step 1</p>
        <h1>냉장고 사진에서 재료를 인식합니다</h1>
        <p>
          JPG, PNG, WebP 이미지를 업로드하면 OpenRouter의
          <code>google/gemma-3-27b-it:free</code> 모델로 식재료 후보를 추출합니다.
        </p>
      </section>

      <section class="panel">
        <label class="upload-box" for="imageInput">
          <input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp" />
          <span>냉장고 사진 선택</span>
          <small>최대 10MB</small>
        </label>

        <div id="previewWrap" class="preview-wrap hidden">
          <img id="previewImage" alt="업로드 이미지 미리보기" />
        </div>

        <div class="actions">
          <button id="recognizeButton" type="button" disabled>재료 인식</button>
          <button id="clearButton" type="button" class="secondary">초기화</button>
        </div>

        <p id="statusMessage" class="status" role="status"></p>
      </section>

      <section id="resultPanel" class="panel hidden">
        <div class="section-title">
          <div>
            <p class="eyebrow">인식 결과</p>
            <h2>재료 목록 확인 및 수정</h2>
          </div>
          <button id="addIngredientButton" type="button" class="secondary">재료 추가</button>
        </div>

        <div id="ingredientsList" class="ingredients-list"></div>

        <div class="actions">
          <button id="confirmButton" type="button">2단계로 넘길 재료 확정</button>
        </div>
      </section>

      <section id="confirmedPanel" class="panel hidden">
        <p class="eyebrow">확정된 입력</p>
        <h2>다음 단계 전달 데이터</h2>
        <pre id="confirmedJson"></pre>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
